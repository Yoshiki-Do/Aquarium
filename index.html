<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquarium</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1>Aquarium</h1>
    <p id="game-day">Day: 1</p>
    <p id="water-quality">Water Quality: 100</p>
    <button id="water-change-button">Water Change</button>
    <button id="feed-button">Feed</button>

    <div id="aquarium"></div>

    <div id="fish-info">
        <h2>Fish Information</h2>
        <p id="fish-name">Select a fish</p>
        <p id="fish-type"></p>
        <p id="fish-age"></p>
        <p id="fish-size"></p>
        <p id="fish-hunger"></p>
        <p id="fish-health"></p>
        <p id="fish-status"></p>
    </div>

    <div id="death-popup" class="popup">
        <div class="popup-content">
            <p id="death-message"></p>
            <button id="death-ok-button">OK</button>
        </div>
    </div>

    <script src="js/fish.js"></script>
    <script src="js/food.js"></script>
    <script src="js/game.js"></script>
    <script src="js/aquarium.js"></script>

</body>

</html>
